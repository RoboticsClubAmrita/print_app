name: print_service_app
description: A static print service app with mocked data.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  file_picker: ^8.1.2
  intl: ^0.20.2
  http: ^1.2.2
  http_parser: ^4.0.2
  flutter_dotenv: ^5.2.1
  flutter_secure_storage: ^9.2.2
  razorpay_flutter: ^1.3.7
  flutter_local_notifications: ^18.0.1
  printing: ^5.14.3
  showcaseview: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# flutter_plugin_android_lifecycle 2.0.2x+ requires apps/plugins that
# depend on it to compile against Android API 36, which file_picker 8.x's
# own Android module doesn't yet declare. Pin to a pre-36 release so the
# AAR metadata check passes without touching file_picker's major version
# (11.x hits an unrelated Kotlin/Java classpath bug under this Gradle/AGP).
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.20

flutter:
  uses-material-design: true
  assets:
    - .env
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/printease_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0B0D"
  adaptive_icon_foreground: "assets/icon/printease_icon.png"

